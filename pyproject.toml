[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocelllink"
version = "0.3.0"
description = "Experimental astroCaST agreement, event hysteresis, and cell attribution"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name="Independent research prototype"}]
license = {text="MIT"}
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-image>=0.20", "tifffile>=2023.0", "h5py>=3.7", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
astrocelllink = "astrocelllink.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrocelllink*"]
